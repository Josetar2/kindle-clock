description "kindle clock autostart"

start on framework_ready or started framework

script
  # userstore is remounted during boot; wait until the path is really usable
  # (avoid 'Stale file handle' when checking /mnt/us/clock/ENABLED)
  n=0
  while [ $n -lt 40 ]; do
    ls /mnt/us/clock/ENABLED >/dev/null 2>&1 && break
    sleep 3
    n=$((n+1))
  done
  [ -f /mnt/us/clock/ENABLED ] && /bin/sh /mnt/us/clock/kindle_clock.sh > /tmp/clock_run.log 2>&1 &
end script
